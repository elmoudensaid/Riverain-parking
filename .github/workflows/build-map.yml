name: Build parking map
on:
  push:
    paths: ["tools/build_map.py", "tools/streets.json", ".github/workflows/build-map.yml"]
  schedule:
    - cron: "17 4 3 * *"   # every month: follow new addresses, places and rule changes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6 pyproj==3.7.0
      - run: python tools/build_map.py
      - name: Commit map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.json
          git diff --cached --quiet || (git commit -m "Mise à jour de la carte" && git pull --rebase && git push)
