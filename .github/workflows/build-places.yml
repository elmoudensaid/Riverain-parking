name: Build official parking places
on:
  push:
    paths: ["tools/build_places.py", "tools/streets.json", ".github/workflows/build-places.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6 pyproj==3.7.0
      - run: python tools/build_places.py
      - name: Commit places.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.json
          git diff --cached --quiet || (git commit -m "Mise à jour des places officielles" && git pull --rebase && git push)
