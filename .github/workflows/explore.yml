name: Explore open data
on:
  push:
    paths: ["tools/explore.py", "tools/explore_args.txt", ".github/workflows/explore.yml"]
  workflow_dispatch:
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pypdf==5.1.0
      - run: python tools/explore.py $(cat tools/explore_args.txt 2>/dev/null)
